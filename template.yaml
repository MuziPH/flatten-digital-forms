AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

# Settings under Globals apply to every Lambda function in this template.
Globals:
  Function:
    # This is the Java runtime that AWS Lambda will use for the function.
    # We keep it at Java 21 so the code runs on a modern supported runtime.
    Runtime: java21
    # Memory controls how much RAM the function gets when it runs in AWS.
    MemorySize: 512
    # Timeout is the maximum number of seconds the Lambda is allowed to run.
    Timeout: 30
    Environment:
      Variables:
        # Spring Cloud Function starts your application through this Spring Boot class.
        # Think of this as the main entry point for the Lambda JVM process.
        MAIN_CLASS: za.co.ocr.DigitalPdfFlattenXfaApplication
        # This tells Spring Cloud Function which bean name should handle SQS messages.
        SPRING_CLOUD_FUNCTION_DEFINITION: flattenPDF
        # Deployed Lambdas should use the AWS profile by default.
        # Local SAM runs can still override this with a local env file.
        SPRING_PROFILES_ACTIVE: aws
        # The BPM auth value is injected at deploy/run time instead of being hardcoded here.
        BPM_AUTH: ${BPM_AUTH}

Resources:
  # The queue that feeds messages into the Lambda.
  EmailInfoQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: EmailInfoQueue

  FlattenXfaFunction:
    Type: AWS::Serverless::Function
    Properties:
      # SAM invokes this handler, which delegates the SQS message into Spring Cloud Function.
      Handler: org.springframework.cloud.function.adapter.aws.FunctionInvoker::handleRequest
      # The project root contains the Maven build files, so SAM can package the app from here.
      CodeUri: .
      # IAM policies grant the Lambda permission to access AWS resources.
      # This Lambda needs permissions to:
      # 1. Read SQS messages from the EmailInfoQueue
      # 2. Read and write to the EmailInfo DynamoDB table
      # 3. Delete messages from SQS after successful processing
      Policies:
        - Version: '2012-10-17'
          Statement:
            # SQS permissions: receive and delete messages
            - Effect: Allow
              Action:
                - sqs:ReceiveMessage
                - sqs:DeleteMessage
                - sqs:GetQueueAttributes
              Resource: !GetAtt EmailInfoQueue.Arn
            # DynamoDB permissions: read and write EmailInfo records
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:GetItem
                - dynamodb:UpdateItem
                - dynamodb:Query
              Resource: arn:aws:dynamodb:af-south-1:190249219972:table/EmailInfo
      Events:
        EmailQueueEvent:
          # This wires the Lambda to the SQS queue defined above.
          Type: SQS
          Properties:
            Queue: !GetAtt EmailInfoQueue.Arn
            BatchSize: 1
