AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

# Settings under Globals apply to every Lambda function in this template.
Globals:
  Function:
    # Lambda now runs on Java 21 because Java 17 is deprecated for deployment.
    Runtime: java21
    MemorySize: 512
    Timeout: 30
    Environment:
      Variables:
        # Spring Cloud Function needs to know which Spring Boot class starts the app.
        MAIN_CLASS: za.co.ocr.DigitalPdfFlattenXfaApplication
        # This tells Spring Cloud Function which bean/function to invoke.
        SPRING_CLOUD_FUNCTION_DEFINITION: flattenPDF
        # Local/testing DynamoDB endpoint. host.docker.internal lets the SAM runtime container reach services running on the host.
        AWS_ENDPOINT: http://host.docker.internal:4566
        SPRING_PROFILES_ACTIVE: localstack
        BPM_AUTH: ${BPM_AUTH}

Resources:
  FlattenXfaFunction:
    Type: AWS::Serverless::Function
    Properties:
      # AWS calls this handler, and Spring Cloud Function routes the request to flattenPDF.
      Handler: org.springframework.cloud.function.adapter.aws.FunctionInvoker::handleRequest
      # Point SAM at the project root so `sam build` can run Maven itself.
      CodeUri: .
